<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="/brand/logo-black.png"
      type="image/png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/brand/logo-white.png"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <title>Noosphere</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0f0f10;
      }
      .noosphere-boot {
        display: grid;
        height: 100%;
        place-items: center;
      }
      .noosphere-boot-media {
        width: min(80vw, 480px);
        aspect-ratio: 16 / 9;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="noosphere-boot" aria-label="Démarrage de Noosphere">
        <video
          class="noosphere-boot-media"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          poster="/brand/logo-white.png"
        >
          <source src="/brand/loading.mp4" type="video/mp4" />
        </video>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
