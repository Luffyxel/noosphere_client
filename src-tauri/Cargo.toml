[package]
name = "noosphere-desktop"
version = "0.1.22"
description = "Noosphere desktop application"
authors = ["Noosphere contributors"]
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.88"

[lib]
name = "noosphere_core"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
noosphere-remote = { path = "remote" }
async-trait = "=0.1.89"
base64 = "=0.23.1"
fs2 = "=0.4.3"
futures-lite = "=2.6.1"
hex = "=0.4.3"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", rev = "eb7864c4d15435ee33681ce828930d9a4296f155" }
rand = "=0.9.4"
reqwest = { version = "=0.13.4", default-features = false, features = [
  "form",
  "json",
  "rustls",
] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", default-features = false, features = [] }
tauri-plugin-notification = "=2.4.0"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.11.0"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["v4"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=4.2.0", default-features = false, features = [
  "v1",
  "windows-native-keyring-store",
] }
tauri = { version = "=2.11.5", features = ["wry"] }
webview2-com = "=0.38.2"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
aes-gcm-siv = "=0.12.1"
ashpd = { version = "=0.13.13", default-features = false, features = [
  "open_uri",
  "tokio",
] }
secret-service = { version = "=5.2.0", default-features = false, features = [
  "crypto-rust",
] }
tauri-runtime-cef = { path = "../vendor/tauri-runtime-cef" }
winit = "=0.31.0-beta.2"
zbus = { version = "=5.19.0", default-features = false, features = [
  "async-io",
  "blocking-api",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
cef-dll-sys = { path = "../vendor/cef-dll-sys" }

[workspace]
members = ["remote"]
resolver = "3"
