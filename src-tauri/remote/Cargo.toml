[package]
name = "noosphere-remote"
version = "0.2.0-dev.1"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", rev = "eb7864c4d15435ee33681ce828930d9a4296f155" }
rand = "=0.9.4"
zeroize = "=1.9.0"
bytes = "=1.12.1"
quinn = { version = "=0.11.11", default-features = false, features = [
  "runtime-tokio",
  "rustls-ring",
] }
rustls = { version = "=0.23.43", default-features = false, features = [
  "std",
  "ring",
] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
  "net",
  "io-util",
  "sync",
] }

rcgen = { version = "=0.14.7", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_Graphics_Direct3D10",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = [
  "tokio",
  "remote_desktop",
  "screencast",
] }
enumflags2 = "=0.7.12"
gst = { package = "gstreamer", version = "=0.24.4", features = ["v1_20"] }
gst-app = { package = "gstreamer-app", version = "=0.24.4", features = [
  "v1_20",
] }
gst-video = { package = "gstreamer-video", version = "=0.24.4", features = [
  "v1_20",
] }
tempfile = "=3.27.0"
wayland-client = "=0.31.12"
wayland-protocols-misc = { version = "=0.3.9", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.9", features = ["client"] }
xkbcommon = { version = "=0.9.0", default-features = false }
x11rb = { version = "=0.13.2", features = ["xtest"] }

[[bin]]
name = "noosphere-remote-bench"
path = "src/bin/benchmark.rs"

[[bin]]
name = "noosphere-remote-host"
path = "src/bin/host.rs"

[[bin]]
name = "noosphere-remote-lab"
path = "src/bin/lab.rs"
