name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev libxkbcommon-x11-0 patchelf protobuf-compiler xvfb
          gstreamer1.0-libav gstreamer1.0-plugins-bad
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-nice
          rpm dbus-x11
      - name: Install Windows Protocol Buffers compiler
        if: runner.os == 'Windows'
        run: choco install protoc --version=35.1.0 --no-progress -y
      - name: Configure Rust
        shell: bash
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component clippy --component rustfmt &&
          rustup default 1.98.0
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Check frontend and Rust
        run: npm run check

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: noosphere-linux
          - os: windows-2025
            bundles: nsis
            artifact: noosphere-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev libxkbcommon-x11-0 patchelf protobuf-compiler xvfb
          gstreamer1.0-libav gstreamer1.0-plugins-bad
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-nice
          rpm dbus-x11
      - name: Install Windows Protocol Buffers compiler
        if: runner.os == 'Windows'
        run: choco install protoc --version=35.1.0 --no-progress -y
      - name: Configure Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - name: Install dependencies
        run: npm ci
      - name: Pin AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo curl --fail --location --retry 5 --retry-all-errors \
            --output /usr/local/lib/appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /usr/local/lib/appimage-runtime' | sha256sum --check
          echo 'LDAI_RUNTIME_FILE=/usr/local/lib/appimage-runtime' >> "$GITHUB_ENV"
          echo 'APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime' >> "$GITHUB_ENV"
      - name: Build Windows package
        if: runner.os == 'Windows'
        run: npm run package:windows
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Smoke test WebView2
        if: runner.os == 'Windows'
        run: npm run smoke:tauri
        env:
          NOOSPHERE_SMOKE_REQUIRE_DEVICE_CAPTURE: '0'
          NOOSPHERE_SMOKE_SYNTHETIC_MEDIA: '1'
      - name: Smoke test Chromium
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run smoke:tauri
      - name: Store packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Configure Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - name: Install dependencies
        run: npm ci
      - name: Audit npm production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Review Rust advisories, licenses and sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories licenses sources
