name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package
        type: string
        default: ''
      reuse_windows_run:
        description: Run containing a validated Windows package for the same tag
        type: string
        default: ''
      auth_hotfix:
        description: Run focused authentication checks instead of the full regression suite
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  REUSE_WINDOWS_RUN: ${{ inputs.reuse_windows_run }}

concurrency:
  group: release-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.auth_hotfix && inputs.reuse_windows_run != '' && '[{"os":"ubuntu-22.04","bundles":"deb,rpm,appimage","artifact":"noosphere-linux"}]' || '[{"os":"ubuntu-22.04","bundles":"deb,rpm,appimage","artifact":"noosphere-linux"},{"os":"windows-2025","bundles":"nsis","artifact":"noosphere-windows"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-build-deps.sh
      - name: Install Windows Protocol Buffers compiler
        if: runner.os == 'Windows'
        run: choco install protoc --version=35.1.0 --no-progress -y
      - name: Configure Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy && rustup default 1.98.0
      - name: Install dependencies
        run: npm ci
      - name: Verify tag
        shell: bash
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - name: Prepare verified Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.cache/tauri"
          while read -r repository asset filename checksum; do
            destination="$HOME/.cache/tauri/$filename"
            gh api "repos/$repository/releases/assets/$asset?cache_bust=$(date +%s)" \
              --header 'Accept: application/octet-stream' \
              --header 'Cache-Control: no-cache' > "$destination"
            printf '%s  %s\n' "$checksum" "$destination" | sha256sum --check
            chmod 755 "$destination"
          done <<'TOOLS'
          tauri-apps/binary-releases 182515537 linuxdeploy-x86_64.AppImage e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef
          linuxdeploy/linuxdeploy-plugin-appimage 602435573 linuxdeploy-plugin-appimage.AppImage 49d6a17160675a6bd1781699aae6bdf7692d98552e02a3671d2183d10547842e
          tauri-apps/binary-releases 274691722 AppRun-x86_64 f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
          TOOLS
      - name: Pin AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo curl --fail --location --retry 5 --retry-all-errors \
            --output /usr/local/lib/appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /usr/local/lib/appimage-runtime' | sha256sum --check
          echo 'LDAI_RUNTIME_FILE=/usr/local/lib/appimage-runtime' >> "$GITHUB_ENV"
          echo 'APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime' >> "$GITHUB_ENV"
      - name: Run tests
        if: ${{ !inputs.auth_hotfix }}
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run check
      - name: Check authentication hotfix formatting
        if: ${{ inputs.auth_hotfix }}
        run: npm run format:check
      - name: Test GitHub installation validation
        if: ${{ inputs.auth_hotfix && runner.os == 'Linux' }}
        run: node scripts/test-github-installation.mjs
      - name: Build Windows package
        if: runner.os == 'Windows'
        run: |
          $env:GITHUB_SHA = git rev-parse HEAD
          npm run package:windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: env GITHUB_SHA="$(git rev-parse HEAD)" npm run package:linux
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Smoke test native remote host
        if: ${{ !inputs.auth_hotfix }}
        run: npm run smoke:remote
      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        run: npm run smoke:tauri
        env:
          NOOSPHERE_SMOKE_REQUIRE_DEVICE_CAPTURE: '0'
          NOOSPHERE_SMOKE_SYNTHETIC_MEDIA: '1'
      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run smoke:appimage
        env:
          NOOSPHERE_SMOKE_GPU: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Store Linux diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noosphere-linux-diagnostics
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
      - name: Collect Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/nsis/*.sig release-assets/
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/noosphere-desktop.exe "release-assets/Noosphere_${version}_portable_x64.exe"
      - name: Collect Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir release-assets
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.sig' \) -exec cp {} release-assets/ \;
      - name: Store packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh run download "$GITHUB_RUN_ID" --dir release-assets
          if [[ -n "$REUSE_WINDOWS_RUN" ]]; then
            [[ "$REUSE_WINDOWS_RUN" =~ ^[1-9][0-9]+$ ]]
            source_commit=$(gh run view "$REUSE_WINDOWS_RUN" --json headSha --jq .headSha)
            test "$source_commit" = "$(git rev-parse HEAD)"
            gh run download "$REUSE_WINDOWS_RUN" --name noosphere-windows --dir release-assets/noosphere-windows
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          node scripts/generate-latest-json.mjs
          node scripts/create-release-aliases.mjs
          mapfile -d '' assets < <(find release-assets -type f -print0)
          for asset in "${assets[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$asset" | cut -d ' ' -f 1)" "$(basename "$asset")"
          done | sort -k 2 > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt --verify-tag --generate-notes --title "Noosphere $RELEASE_TAG"
