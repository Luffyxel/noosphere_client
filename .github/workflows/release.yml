name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: noosphere-linux
          - os: windows-2025
            bundles: nsis
            artifact: noosphere-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev libxkbcommon-x11-0 patchelf protobuf-compiler xvfb
          gstreamer1.0-libav gstreamer1.0-plugins-bad
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-nice
          rpm dbus-x11
      - name: Install Windows Protocol Buffers compiler
        if: runner.os == 'Windows'
        run: choco install protoc --version=35.1.0 --no-progress -y
      - name: Configure Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - name: Install dependencies
        run: npm ci
      - name: Verify tag
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Pin AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo curl --fail --location --retry 5 --retry-all-errors \
            --output /usr/local/lib/appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /usr/local/lib/appimage-runtime' | sha256sum --check
          echo 'LDAI_RUNTIME_FILE=/usr/local/lib/appimage-runtime' >> "$GITHUB_ENV"
          echo 'APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime' >> "$GITHUB_ENV"
      - name: Run tests
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run check
      - name: Build Windows package
        if: runner.os == 'Windows'
        run: npm run build -- --bundles ${{ matrix.bundles }}
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        run: npm run smoke:tauri
      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run smoke:tauri
      - name: Collect Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item src-tauri/target/release/noosphere-desktop.exe release-assets/Noosphere-portable-x64.exe
      - name: Collect Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir release-assets
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} release-assets/ \;
      - name: Store packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --dir release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          for asset in "${assets[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$asset" | cut -d ' ' -f 1)" "$(basename "$asset")"
          done | sort -k 2 > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" SHA256SUMS.txt --verify-tag --generate-notes --title "Noosphere $GITHUB_REF_NAME"
